<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফ্রি লাইসেন্স পরীক্ষা কাউন্টডাউন - পালস</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Noto Serif Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4 text-white relative overflow-hidden">

    <!-- Decorative background elements -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-xl mx-auto glass-card rounded-3xl p-8 sm:p-10 shadow-2xl relative z-10 text-center transition-all duration-300">
        
        <!-- Logo Section -->
        <div class="mb-8 flex justify-center">
            <div class="p-3 bg-white/10 rounded-2xl border border-white/20 shadow-inner inline-block animate-pulse">
                <img src="https://i.ibb.co.com/Ld7snkkP/logo.png" alt="Pulse Logo" class="h-16 w-auto object-contain drop-shadow-md" onerror="this.src='https://placehold.co/120x50/1e1b4b/ffffff?text=PULSE'">
            </div>
        </div>

        <!-- Header Text -->
        <div class="mb-8">
            <span class="inline-block px-4 py-1.5 rounded-full bg-indigo-500/20 text-indigo-300 text-sm font-semibold mb-3 border border-indigo-500/30">
                বিশেষ ঘোষণা
            </span>
            <h1 class="text-2xl sm:text-3xl font-bold leading-relaxed text-slate-100">
                আজকের ফ্রি লাইসেন্স পরীক্ষাটি শুরু হবে আজ রাত ১০ঃ০০ টায়
            </h1>
        </div>

        <!-- Countdown Timer Section -->
        <div id="timer-container" class="grid grid-cols-3 gap-3 sm:gap-4 mb-8">
            <!-- Hours -->
            <div class="glass-card rounded-2xl p-4 sm:p-6 text-center transform hover:scale-105 transition-transform duration-300">
                <span id="hours" class="text-3xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-white block mb-1">00</span>
                <span class="text-xs sm:text-sm uppercase tracking-wider text-slate-300 font-medium">ঘণ্টা</span>
            </div>
            <!-- Minutes -->
            <div class="glass-card rounded-2xl p-4 sm:p-6 text-center transform hover:scale-105 transition-transform duration-300">
                <span id="minutes" class="text-3xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-white block mb-1">00</span>
                <span class="text-xs sm:text-sm uppercase tracking-wider text-slate-300 font-medium">মিনিট</span>
            </div>
            <!-- Seconds -->
            <div class="glass-card rounded-2xl p-4 sm:p-6 text-center transform hover:scale-105 transition-transform duration-300">
                <span id="seconds" class="text-3xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-white block mb-1">00</span>
                <span class="text-xs sm:text-sm uppercase tracking-wider text-slate-300 font-medium">সেকেন্ড</span>
            </div>
        </div>

        <!-- Live Status / Action Area -->
        <div id="status-message" class="text-slate-300 text-sm font-medium bg-white/5 py-3 px-6 rounded-xl border border-white/10">
            পরীক্ষা শুরু হওয়ার বাকি আর মাত্র...
        </div>

    </div>

    <script>
        // Target time calculation (Today at 10:00 PM)
        function getTargetTime() {
            const now = new Date();
            const target = new Date();
            target.setHours(22, 0, 0, 0); // 10:00 PM

            // If it's already past 10 PM today, target can be set or message shown.
            // For countdown purposes, we target today 22:00:00.
            return target;
        }

        function updateCountdown() {
            const now = new Date();
            const target = getTargetTime();
            let diff = target - now;

            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const statusEl = document.getElementById('status-message');

            if (diff <= 0) {
                // If time is up or passed
                hoursEl.innerText = "০০";
                minutesEl.innerText = "০০";
                secondsEl.innerText = "০০";
                statusEl.innerHTML = "🎉 পরীক্ষাটি ইতোমধ্যে শুরু হয়ে গেছে!";
                statusEl.className = "text-emerald-400 font-semibold bg-emerald-500/10 py-3 px-6 rounded-xl border border-emerald-500/20 animate-pulse";
                return;
            }

            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            // Format numbers to always show two digits
            hoursEl.innerText = String(hours).padStart(2, '0');
            minutesEl.innerText = String(minutes).padStart(2, '0');
            secondsEl.innerText = String(seconds).padStart(2, '0');
        }

        // Run immediately and then every second
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
